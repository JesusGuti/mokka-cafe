name: Backend Tests
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".nvmrc"
      - ".github/workflows/backend.yml"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".nvmrc"
      - ".github/workflows/backend.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mokka
          POSTGRES_PASSWORD: mokka
          POSTGRES_DB: mokka_cafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mokka -d mokka_cafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # La versión de pnpm sale de "packageManager" en backend/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Lint
        run: pnpm lint:ci
      - name: Type check
        run: pnpm tsc --noEmit
      - name: Run unit tests
        run: pnpm test
      - name: Run e2e tests
        run: pnpm test:e2e
