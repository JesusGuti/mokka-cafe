name: Playwright Tests
on:
  pull_request:
    branches: [main, develop]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # playwright.config.ts levanta el backend de test en este puerto vía
      # su webServer (db:test:reset + db:test:seed + e2e:serve) antes de
      # correr los tests — ver e2e/auth.setup.ts, que necesita loguearse
      # contra un backend real como ADMIN.
      NEXT_PUBLIC_API_URL: http://localhost:8081
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mokka
          POSTGRES_PASSWORD: mokka
          POSTGRES_DB: mokka_cafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mokka -d mokka_cafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: backend
        run: pnpm prisma:generate
      - name: Migrate test database
        working-directory: backend
        run: pnpm db:test:migrate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        working-directory: frontend
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
