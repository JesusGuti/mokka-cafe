name: Backend Tests
on:
  pull_request:
    branches: [main, develop]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mokka
          POSTGRES_PASSWORD: mokka
          POSTGRES_DB: mokka_cafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mokka -d mokka_cafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Run unit tests
        run: pnpm test
      - name: Run e2e tests
        run: pnpm test:e2e
