name: Bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Frontend
        - Backend
        - Ambos / no estoy seguro
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: Qué pasó
      description: Qué esperabas que pasara vs. qué pasó en realidad
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Logs, capturas, en qué rama/commit pasó, etc.
    validations:
      required: false
